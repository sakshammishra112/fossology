; Scheduler configuration file for the Enhanced Reuser agent
[default]

; name: The name of the agent from the agent table
name = enhancedreuser

; command: The command used by the scheduler to start an instance of this agent
command = enhancedreuser

; max: Maximum number of concurrent instances (-1 = unlimited)
max = -1

; special: Scheduler directives for special agent attributes (comma-separated)
special[] =
